databases:
  - name: fluxo-postgres
    plan: free
    databaseName: fluxo
    user: fluxo
    region: oregon

services:
  - type: web
    name: fluxo-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build:api
    startCommand: npm run db:migrate:deploy && npm run start:api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fluxo-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://godoy-jr.github.io
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
